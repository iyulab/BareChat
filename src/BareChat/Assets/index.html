<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="{{THEME_COLOR}}">
  <title>{{APP_NAME}}</title>
  <link rel="manifest" href="{{BASE}}/manifest.webmanifest">
  <link rel="icon" href="{{BASE}}/branding/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{BASE}}/branding/icon-192.png">
  <link rel="stylesheet" href="{{BASE}}/app.css">
  <script>
    window.BARECHAT_BASE = "{{BASE}}";
    window.BARECHAT_APP_NAME = "{{APP_NAME}}";
    // Apply a host-forced theme before first paint (no flash). A host (e.g. WPF) passes ?theme=light|dark
    // to match its own theme; runtime changes arrive via the "theme" bridge message. Default stays dark.
    (function () {
      var t = new URLSearchParams(location.search).get("theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <div id="app" class="app">
    <!-- Channel list view -->
    <section id="list-view" class="view view--active">
      <header class="topbar">
        <h1 class="topbar__title">{{APP_NAME}}</h1>
        <button id="install" class="iconbtn" title="Install app" aria-label="Install app" hidden>⤓</button>
        <button id="new-channel" class="iconbtn" title="New channel" aria-label="New channel">+</button>
      </header>
      <ul id="channel-list" class="channels"></ul>
    </section>

    <!-- Conversation view -->
    <section id="chat-view" class="view">
      <header class="topbar">
        <button id="back" class="iconbtn" aria-label="Back">‹</button>
        <h1 id="chat-title" class="topbar__title">&nbsp;</h1>
        <button id="add-member" class="iconbtn" title="Add member" aria-label="Add member" hidden>＋</button>
        <span id="conn" class="conn" role="status" aria-live="polite" aria-label="Connecting">●</span>
      </header>
      <!-- role=log: assistive tech announces appended messages (WAI-ARIA chat pattern). -->
      <div id="messages" class="messages" role="log" aria-live="polite" aria-label="Messages"></div>
      <form id="composer" class="composer" autocomplete="off">
        <button id="attach" class="iconbtn" type="button" aria-label="Attach image">＋</button>
        <input id="file" type="file" accept="image/*" hidden />
        <input id="text" class="composer__input" type="text" placeholder="Message" aria-label="Message" autocomplete="off" />
        <button class="composer__send" type="submit" aria-label="Send">▲</button>
      </form>
    </section>
  </div>

  <script src="{{BASE}}/signalr.min.js"></script>
  <script src="{{BASE}}/app.js"></script>
</body>
</html>
